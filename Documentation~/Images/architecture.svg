<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">ABC runtime architecture</title>
  <desc id="desc">Scene actors and scene-free actor models share one module and lifecycle API, with optional indexed world queries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141a31"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1688f0"/>
      <stop offset="1" stop-color="#45b8ff"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7357ff"/>
      <stop offset="1" stop-color="#a970ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#63729b"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <circle cx="1070" cy="45" r="180" fill="#1688f0" opacity=".05"/>
  <circle cx="120" cy="620" r="220" fill="#8b5cf6" opacity=".06"/>
  <text x="60" y="64" fill="#f5f7ff" font-family="Inter,Segoe UI,sans-serif" font-size="28" font-weight="700">One gameplay model, two execution modes</text>
  <text x="60" y="94" fill="#9aa7c7" font-family="Inter,Segoe UI,sans-serif" font-size="16">Use only the layers a feature needs. Every optimized service is lazy.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="140" width="300" height="126" rx="18" fill="#171f39" stroke="#2f4269"/>
    <rect x="60" y="140" width="7" height="126" rx="4" fill="url(#blue)"/>
    <text x="88" y="178" fill="#71c7ff" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">UNITY SCENE</text>
    <text x="88" y="214" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="26" font-weight="700">Actor</text>
    <text x="88" y="242" fill="#9aa7c7" font-family="Inter,Segoe UI,sans-serif" font-size="15">GameObject · MonoBehaviour · Blueprint</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="60" y="310" width="300" height="126" rx="18" fill="#171f39" stroke="#40366f"/>
    <rect x="60" y="310" width="7" height="126" rx="4" fill="url(#violet)"/>
    <text x="88" y="348" fill="#b49cff" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">PURE C# SIMULATION</text>
    <text x="88" y="384" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="26" font-weight="700">ActorModel</text>
    <text x="88" y="412" fill="#9aa7c7" font-family="Inter,Segoe UI,sans-serif" font-size="15">No scene · No view · Same IActor API</text>
  </g>

  <path d="M360 203 H452" stroke="#63729b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M360 373 H412 Q438 373 438 347 V289 Q438 266 462 266" fill="none" stroke="#63729b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="470" y="174" width="310" height="184" rx="20" fill="#1a233f" stroke="#48618d"/>
    <text x="500" y="214" fill="#f5f7ff" font-family="Inter,Segoe UI,sans-serif" font-size="24" font-weight="700">ActorModuleStore</text>
    <text x="500" y="244" fill="#9aa7c7" font-family="Inter,Segoe UI,sans-serif" font-size="15">Shared composition and lifecycle core</text>
    <rect x="500" y="270" width="112" height="38" rx="10" fill="#233154"/>
    <text x="556" y="294" text-anchor="middle" fill="#8fd5ff" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="600">Compact slots</text>
    <rect x="624" y="270" width="126" height="38" rx="10" fill="#302852"/>
    <text x="687" y="294" text-anchor="middle" fill="#c2afff" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="600">Lifecycle</text>
    <text x="500" y="334" fill="#cad2e7" font-family="Inter,Segoe UI,sans-serif" font-size="14">Data · Behaviours · Commands · Ticks</text>
  </g>

  <path d="M780 266 H838" stroke="#63729b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="850" y="140" width="290" height="296" rx="20" fill="#171f39" stroke="#3a4c75"/>
    <text x="880" y="181" fill="#f5f7ff" font-family="Inter,Segoe UI,sans-serif" font-size="24" font-weight="700">ActorWorld</text>
    <text x="880" y="208" fill="#9aa7c7" font-family="Inter,Segoe UI,sans-serif" font-size="15">Optional scale layer</text>
    <rect x="880" y="236" width="230" height="48" rx="12" fill="#1f2d4d"/>
    <text x="895" y="257" fill="#7d8cab" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="700">PACKED OWNERSHIP</text>
    <text x="895" y="275" fill="#e6ebf8" font-family="Inter,Segoe UI,sans-serif" font-size="14">stable, mutation-safe iteration</text>
    <rect x="880" y="296" width="230" height="48" rx="12" fill="#25264e"/>
    <text x="895" y="317" fill="#9989e8" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="700">LAZY QUERY INDEXES</text>
    <text x="895" y="335" fill="#e6ebf8" font-family="Inter,Segoe UI,sans-serif" font-size="14">smallest-set intersection</text>
    <rect x="880" y="356" width="230" height="48" rx="12" fill="#173446"/>
    <text x="895" y="377" fill="#4ec7db" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="700">ZERO-GARBAGE HOT PATH</text>
    <text x="895" y="395" fill="#e6ebf8" font-family="Inter,Segoe UI,sans-serif" font-size="14">delegate or struct action API</text>
  </g>

  <g>
    <rect x="60" y="494" width="1080" height="78" rx="16" fill="#11182d" stroke="#2b385c"/>
    <text x="88" y="525" fill="#6fc8ff" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="700" letter-spacing="1.3">FAST PATH</text>
    <text x="88" y="551" fill="#e8edf9" font-family="Inter,Segoe UI,sans-serif" font-size="16">Resolve once in Initialize</text>
    <path d="M290 534 H350" stroke="#63729b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="378" y="551" fill="#e8edf9" font-family="Inter,Segoe UI,sans-serif" font-size="16">Direct field reads</text>
    <path d="M555 534 H615" stroke="#63729b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="643" y="551" fill="#e8edf9" font-family="Inter,Segoe UI,sans-serif" font-size="16">Indexed batch query where scale matters</text>
  </g>
</svg>
