<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">ABC prototype to scale workflow</title>
  <desc id="desc">The same data and behaviours move from a Unity scene prototype to a high-volume indexed simulation without an architectural rewrite.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f8ff"/>
      <stop offset="1" stop-color="#edf0fb"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1688f0"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#516083" flood-opacity=".16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#68769a"/>
    </marker>
  </defs>
  <rect width="1200" height="390" rx="28" fill="url(#bg)"/>
  <text x="600" y="54" text-anchor="middle" fill="#17213b" font-family="Inter,Segoe UI,sans-serif" font-size="26" font-weight="700">From idea to scale without changing the gameplay model</text>
  <path d="M220 113 H980" stroke="url(#line)" stroke-width="5" stroke-linecap="round" opacity=".32"/>

  <g filter="url(#shadow)">
    <rect x="55" y="92" width="300" height="218" rx="20" fill="#fff" stroke="#d7dff1"/>
    <circle cx="92" cy="128" r="20" fill="#1688f0"/>
    <text x="92" y="135" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">1</text>
    <text x="124" y="136" fill="#17213b" font-family="Inter,Segoe UI,sans-serif" font-size="21" font-weight="700">Prototype</text>
    <text x="82" y="181" fill="#43506f" font-family="Inter,Segoe UI,sans-serif" font-size="16">Add Actor to a GameObject</text>
    <text x="82" y="211" fill="#43506f" font-family="Inter,Segoe UI,sans-serif" font-size="16">Write plain data and behaviours</text>
    <text x="82" y="241" fill="#43506f" font-family="Inter,Segoe UI,sans-serif" font-size="16">Tune through built-in inspectors</text>
    <rect x="82" y="263" width="144" height="28" rx="14" fill="#e8f4ff"/>
    <text x="154" y="282" text-anchor="middle" fill="#0873ce" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="700">MINUTES TO PLAY</text>
  </g>

  <path d="M355 201 H430" stroke="#68769a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="450" y="92" width="300" height="218" rx="20" fill="#fff" stroke="#d7dff1"/>
    <circle cx="487" cy="128" r="20" fill="#4b7fea"/>
    <text x="487" y="135" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">2</text>
    <text x="519" y="136" fill="#17213b" font-family="Inter,Segoe UI,sans-serif" font-size="21" font-weight="700">Compose</text>
    <text x="477" y="181" fill="#43506f" font-family="Inter,Segoe UI,sans-serif" font-size="16">Reuse blueprint compositions</text>
    <text x="477" y="211" fill="#43506f" font-family="Inter,Segoe UI,sans-serif" font-size="16">Test ActorModel without scenes</text>
    <text x="477" y="241" fill="#43506f" font-family="Inter,Segoe UI,sans-serif" font-size="16">Keep dependencies explicit</text>
    <rect x="477" y="263" width="148" height="28" rx="14" fill="#edf0ff"/>
    <text x="551" y="282" text-anchor="middle" fill="#4f5fd4" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="700">SAME IActor API</text>
  </g>

  <path d="M750 201 H825" stroke="#68769a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="845" y="92" width="300" height="218" rx="20" fill="#fff" stroke="#d7dff1"/>
    <circle cx="882" cy="128" r="20" fill="#8b5cf6"/>
    <text x="882" y="135" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">3</text>
    <text x="914" y="136" fill="#17213b" font-family="Inter,Segoe UI,sans-serif" font-size="21" font-weight="700">Scale selectively</text>
    <text x="872" y="181" fill="#43506f" font-family="Inter,Segoe UI,sans-serif" font-size="16">Reserve ActorWorld capacity</text>
    <text x="872" y="211" fill="#43506f" font-family="Inter,Segoe UI,sans-serif" font-size="16">Index only queried data types</text>
    <text x="872" y="241" fill="#43506f" font-family="Inter,Segoe UI,sans-serif" font-size="16">Use struct actions in hot loops</text>
    <rect x="872" y="263" width="126" height="28" rx="14" fill="#f2eaff"/>
    <text x="935" y="282" text-anchor="middle" fill="#7443ce" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="700">NO REWRITE</text>
  </g>

  <rect x="270" y="340" width="660" height="30" rx="15" fill="#17213b"/>
  <text x="600" y="360" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="1">NO MODULE KEYS · NO REQUIRED CODEGEN · NO PAID EDITOR PLUGINS</text>
</svg>
